name: Deploy react

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t mohamed/react-test -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true mohamed/react-test npm run test

      - run: docker build -t mohamed3gamal/multi-client ./microservices/client
      - run: docker build -t mohamed3gamal/multi-nginx ./microservices/nginx
      - run: docker build -t mohamed3gamal/multi-server ./microservices/server
      - run: docker build -t mohamed3gamal/multi-worker ./microservices/worker

      - run: docker push mohamed3gamal/multi-client
      - run: docker push mohamed3gamal/multi-nginx
      - run: docker push mohamed3gamal/multi-server
      - run: docker push mohamed3gamal/multi-worker
